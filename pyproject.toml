[project]
name = "roleplay-server"
version = "0.1.0"
description = "Fully local AI roleplay chat server (Phase 0-1 scaffold)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on the path so conftest helpers import cleanly
pythonpath = [".", "tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
