[project]
name = "roleplay-server"
version = "0.1.0"
description = "Fully local AI roleplay chat server (Phase 0-1 scaffold)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # Time-zone data for quiet hours, in case the image has no system zoneinfo.
    # Data only; nothing in it touches the network.
    "tzdata>=2024.1",
    # Reading messages aloud on the CPU (chat/voices.py). GPL-3, used unmodified.
    "piper-tts>=1.3",
    # Speaking instead of typing, on the CPU (chat/listen.py). av 16 and up dropped an
    # argument faster-whisper 1.2 passes when it opens a recording.
    "faster-whisper>=1.2,<1.3",
    "av<16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on the path so conftest helpers import cleanly
pythonpath = [".", "tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
